[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pdn-lab1"
version = "3.0.0"
description = "Распознавание восьми атрибутов ПДн: RuBERT, правила и общая оценка NER"
requires-python = ">=3.11,<3.14"
dependencies = ["Faker==37.6.0", "scikit-learn==1.7.2", "numpy==2.2.6", "email-validator==2.3.0", "phonenumbers==9.0.17"]

[project.optional-dependencies]
model = ["torch==2.9.1", "transformers==4.57.1"]
dev = ["pytest==8.4.2"]

[project.scripts]
pdn-lab = "pdn_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
